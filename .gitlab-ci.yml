# Self-check for the agent repository. Target repositories use
# ci/gitlab-codereview.yml (or the copy in docs/gitlab-codereview.example.yml).
stages:
  - verify

variables:
  CODEREVIEW_PYTHON_IMAGE: python:3.11
  # GitLab CI cache is not a security boundary: an MR that edits
  # .gitlab-ci.yml can write any cache key. The self-check therefore uses no
  # GitLab cache and no pip cache, so a branch cannot poison main's verify run.
  PIP_NO_CACHE_DIR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

verify:
  stage: verify
  image: $CODEREVIEW_PYTHON_IMAGE
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - python -m pip install -r requirements.txt
    - python -m compileall -q src scripts tests
    - python -I -X utf8 -m pytest -q
    - python -m pip wheel . --no-deps -w dist
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/*.whl
