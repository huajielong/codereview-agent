# Reusable GitLab CI template for AI code review.
#
# Include it from a target repository:
#
#   include:
#     - project: huajielong/codereview-agent
#       ref: main
#       file: /ci/gitlab-codereview.yml
#
# Required CI/CD variables in the target repository:
#   CODEREVIEW_GITLAB_TOKEN       PAT / project access token with api scope.
#   CODEREVIEW_AGENT_CLONE_TOKEN  Optional deploy token (read_repository) for
#                                 cloning the private agent repository.
#   OPENAI_API_KEY / OPENAI_BASE_URL / OPENAI_MODEL (+ optional COHERE_*).
#
# The job is intentionally same-project-only. Fork MR pipelines run in the fork
# project and cannot read the target project's variables; use the webhook
# service for fork MRs.

variables:
  CODEREVIEW_PYTHON_IMAGE: python:3.11
  CODEREVIEW_AGENT_PATH: huajielong/codereview-agent
  CODEREVIEW_AGENT_REF: main
  CODEREVIEW_AGENT_CLONE_USER: oauth2
  CODEREVIEW_MODE: security
  CODEREVIEW_CONTEXT_ENABLED: "true"
  CODEREVIEW_DEPENDENCY_ENABLED: "true"
  CODEREVIEW_HISTORY_ENABLED: "true"
  CODEREVIEW_ALLOW_TRUNCATED_DIFF: "false"

.codereview_base:
  stage: test
  image: $CODEREVIEW_PYTHON_IMAGE
  resource_group: "codereview-$CI_PROJECT_ID"
  interruptible: false
  variables:
    GIT_STRATEGY: none
    GIT_TERMINAL_PROMPT: "0"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    OPENAI_TIMEOUT: "300"
    GITLAB_TOKEN: "$CODEREVIEW_GITLAB_TOKEN"
    GITLAB_BASE_URL: "$CI_SERVER_URL"
    DATABASE_PATH: "$CI_PROJECT_DIR/.codereview-state/codereview.db"
    CHROMA_PATH: "$CI_PROJECT_DIR/.codereview-state/chroma"
    CACHE_DIR: "$CI_PROJECT_DIR/.codereview-state/cache"
    REVIEW_AUDIT_PATH: "$CI_PROJECT_DIR/.codereview-state/audit.jsonl"
    REVIEW_HISTORY_PATH: "$CI_PROJECT_DIR/.codereview-state/history.jsonl"
    REVIEW_MODE: "$CODEREVIEW_MODE"
    REVIEW_DRY_RUN: "false"
    REVIEW_ALLOWED_REPOS: "$CI_MERGE_REQUEST_PROJECT_PATH"
    REVIEW_CONTEXT_ENABLED: "$CODEREVIEW_CONTEXT_ENABLED"
    REVIEW_DEPENDENCY_ENABLED: "$CODEREVIEW_DEPENDENCY_ENABLED"
    REVIEW_HISTORY_ENABLED: "$CODEREVIEW_HISTORY_ENABLED"
    REVIEW_POST_ON_PARTIAL: "false"
    GITLAB_ALLOW_TRUNCATED_DIFF: "$CODEREVIEW_ALLOW_TRUNCATED_DIFF"
  cache:
    key: "codereview-state-$CI_PROJECT_ID"
    paths:
      - .codereview-state/
      - .cache/pip/
    policy: pull-push
    when: always
  before_script:
    - mkdir -p .codereview-state .cache/pip
    - CLONE_USER="${CODEREVIEW_AGENT_CLONE_USER:-oauth2}"
    - CLONE_TOKEN="${CODEREVIEW_AGENT_CLONE_TOKEN:-$CODEREVIEW_GITLAB_TOKEN}"
    - SERVER="${CI_SERVER_URL}"
    - SCHEME="${SERVER%%://*}"
    - SERVER="${SERVER#*://}"
    - git clone --depth 1 --branch "$CODEREVIEW_AGENT_REF" "${SCHEME}://${CLONE_USER}:${CLONE_TOKEN}@${SERVER}/${CODEREVIEW_AGENT_PATH}.git" .codereview-agent
    - python -m pip install -r .codereview-agent/requirements.txt
    - python -m pip install --no-deps -e .codereview-agent

codereview:
  extends: .codereview_base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_PATH == $CI_MERGE_REQUEST_PROJECT_PATH'
  script:
    - python -I -X utf8 -m codereview.cli --provider gitlab --repo "$CI_MERGE_REQUEST_PROJECT_PATH" --pr "$CI_MERGE_REQUEST_IID" --post --json-out codereview.json
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - codereview.json

# Optional: audit direct pushes to the default branch. The CLI never posts in
# --push mode; it exits non-zero when a high-severity finding is present.
codereview-push-audit:
  extends: .codereview_base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    REVIEW_DRY_RUN: "true"
  script:
    - python -I -X utf8 -m codereview.cli --provider gitlab --repo "$CI_PROJECT_PATH" --push --before "$CI_COMMIT_BEFORE_SHA" --after "$CI_COMMIT_SHA" --branch "$CI_COMMIT_BRANCH" --push-title "$CI_COMMIT_TITLE" --fail-on-severity high --json-out push-audit.json
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - push-audit.json
