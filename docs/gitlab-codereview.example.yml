# Copy-paste variant of ci/gitlab-codereview.yml for repositories that cannot
# use include:project (for example, external repositories without access to the
# private agent project).
#
# Copy the jobs below into the target repository's .gitlab-ci.yml, or keep this
# file as .gitlab-ci.yml. Configure the variables documented in docs/GITLAB.md.
# The agent repository is cloned with the required read_repository
# CODEREVIEW_AGENT_CLONE_TOKEN. CODEREVIEW_AGENT_REF must be a version tag
# (vX.Y.Z) or a full 40-char commit SHA; a mutable branch requires
# CODEREVIEW_ALLOW_MUTABLE_AGENT_REF=true.

variables:
  CODEREVIEW_PYTHON_IMAGE: python:3.11
  CODEREVIEW_AGENT_PATH: huajielong/codereview-agent
  CODEREVIEW_AGENT_REF: v0.1.0
  CODEREVIEW_AGENT_CLONE_USER: oauth2
  CODEREVIEW_MODE: security
  CODEREVIEW_CONTEXT_ENABLED: "true"
  CODEREVIEW_DEPENDENCY_ENABLED: "true"
  CODEREVIEW_HISTORY_ENABLED: "true"
  CODEREVIEW_ALLOW_TRUNCATED_DIFF: "false"

.codereview_base:
  stage: test
  image: $CODEREVIEW_PYTHON_IMAGE
  resource_group: "codereview-$CI_PROJECT_ID"
  interruptible: false
  variables:
    GIT_STRATEGY: none
    GIT_TERMINAL_PROMPT: "0"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    OPENAI_TIMEOUT: "300"
    GITLAB_TOKEN: "$CODEREVIEW_GITLAB_TOKEN"
    GITLAB_BASE_URL: "$CI_SERVER_URL"
    DATABASE_PATH: "$CI_PROJECT_DIR/.codereview-state/codereview.db"
    CHROMA_PATH: "$CI_PROJECT_DIR/.codereview-state/chroma"
    CACHE_DIR: "$CI_PROJECT_DIR/.codereview-state/cache"
    REVIEW_AUDIT_PATH: "$CI_PROJECT_DIR/.codereview-state/audit.jsonl"
    REVIEW_HISTORY_PATH: "$CI_PROJECT_DIR/.codereview-state/history.jsonl"
    REVIEW_MODE: "$CODEREVIEW_MODE"
    REVIEW_DRY_RUN: "false"
    REVIEW_ALLOWED_REPOS: "$CI_MERGE_REQUEST_PROJECT_PATH"
    REVIEW_CONTEXT_ENABLED: "$CODEREVIEW_CONTEXT_ENABLED"
    REVIEW_DEPENDENCY_ENABLED: "$CODEREVIEW_DEPENDENCY_ENABLED"
    REVIEW_HISTORY_ENABLED: "$CODEREVIEW_HISTORY_ENABLED"
    REVIEW_POST_ON_PARTIAL: "false"
    GITLAB_ALLOW_TRUNCATED_DIFF: "$CODEREVIEW_ALLOW_TRUNCATED_DIFF"
  cache:
    # MR-only cache. GitLab CI cache is not a security boundary: an MR that
    # controls .gitlab-ci.yml can write any key. The protected push-audit job
    # below disables the cache and pip cache, so MR data cannot reach main.
    key: "codereview-state-$CI_PROJECT_ID-$CI_COMMIT_REF_SLUG-$CI_COMMIT_REF_PROTECTED-$CI_MERGE_REQUEST_IID"
    paths:
      - .codereview-state/
      - .cache/pip/
    policy: pull-push
    when: always
  before_script:
    - mkdir -p .codereview-state .cache/pip
    - if [ -z "$CODEREVIEW_AGENT_CLONE_TOKEN" ]; then echo "CODEREVIEW_AGENT_CLONE_TOKEN is required (read_repository deploy token)"; exit 1; fi
    - if ! git check-ref-format --branch "$CODEREVIEW_AGENT_REF" >/dev/null 2>&1; then echo "CODEREVIEW_AGENT_REF must be a single valid tag/SHA ref"; exit 1; fi
    - if [ "${CODEREVIEW_ALLOW_MUTABLE_AGENT_REF:-false}" != "true" ]; then printf '%s' "$CODEREVIEW_AGENT_REF" | grep -Eq '^(v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?|[0-9a-fA-F]{40})$' || { echo "CODEREVIEW_AGENT_REF must be a version tag (vX.Y.Z) or a full 40-char commit SHA; set CODEREVIEW_ALLOW_MUTABLE_AGENT_REF=true to use a branch"; exit 1; }; fi
    - SERVER="${CI_SERVER_URL}"
    - SCHEME="${SERVER%%://*}"
    - SERVER="${SERVER#*://}"
    - AGENT_URL="${SCHEME}://${SERVER}/${CODEREVIEW_AGENT_PATH}.git"
    - CREDENTIAL_HELPER='!f() { test "$1" = get && printf "username=%s\npassword=%s\n" "${CODEREVIEW_AGENT_CLONE_USER:-oauth2}" "$CODEREVIEW_AGENT_CLONE_TOKEN"; }; f'
    - rm -rf .codereview-agent
    - |
      if printf '%s' "$CODEREVIEW_AGENT_REF" | grep -Eq '^[0-9a-fA-F]{40}$'; then
        AGENT_SHA=$(printf '%s' "$CODEREVIEW_AGENT_REF" | tr 'A-F' 'a-f')
        git init -q .codereview-agent
        git -C .codereview-agent remote add origin "$AGENT_URL"
        git -C .codereview-agent -c "credential.helper=$CREDENTIAL_HELPER" fetch --depth 1 origin "$AGENT_SHA"
        if [ "$(git -C .codereview-agent rev-parse FETCH_HEAD)" != "$AGENT_SHA" ]; then
          echo "CODEREVIEW_AGENT_REF did not resolve to the requested commit"
          exit 1
        fi
        git -C .codereview-agent checkout -q --detach FETCH_HEAD
      else
        git -c "credential.helper=$CREDENTIAL_HELPER" clone --depth 1 --branch "$CODEREVIEW_AGENT_REF" "$AGENT_URL" .codereview-agent
      fi
    - if [ "${CODEREVIEW_ALLOW_MUTABLE_AGENT_REF:-false}" != "true" ] && git -C .codereview-agent symbolic-ref -q HEAD >/dev/null; then echo "CODEREVIEW_AGENT_REF resolved to a branch; pin a tag or commit"; exit 1; fi
    - python -m pip install -r .codereview-agent/requirements.txt
    - python -m pip install --no-deps -e .codereview-agent

codereview:
  extends: .codereview_base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_PATH == $CI_MERGE_REQUEST_PROJECT_PATH'
  script:
    - python -I -X utf8 -m codereview.cli --provider gitlab --repo "$CI_MERGE_REQUEST_PROJECT_PATH" --pr "$CI_MERGE_REQUEST_IID" --post --json-out codereview.json
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - codereview.json

codereview-push-audit:
  extends: .codereview_base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  # Do not restore any cache into the protected default-branch job.
  cache: []
  variables:
    REVIEW_DRY_RUN: "true"
    PIP_NO_CACHE_DIR: "1"
  script:
    - python -I -X utf8 -m codereview.cli --provider gitlab --repo "$CI_PROJECT_PATH" --push --before "$CI_COMMIT_BEFORE_SHA" --after "$CI_COMMIT_SHA" --branch "$CI_COMMIT_BRANCH" --push-title "$CI_COMMIT_TITLE" --fail-on-severity high --json-out push-audit.json
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - push-audit.json
