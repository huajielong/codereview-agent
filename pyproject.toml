[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codereview-agent"
version = "0.1.0"
description = "Production GitHub PR security review agent extracted from DeepLearning.AI L6"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.128.8",
  "uvicorn[standard]==0.39.0",
  "httpx==0.28.1",
  "openai==2.41.1",
  "chromadb==1.5.9",
  "cohere==7.3.1",
  "PyJWT==2.13.0",
  "cryptography>=42.0",
  "python-dotenv==1.2.1",
]

[project.optional-dependencies]
test = ["pytest==7.4.3"]

[project.scripts]
codereview-review = "codereview.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
